# Publishes a version tag through npm OIDC after both CLI runtimes pass the tests.
# The publish environment accepts v* tags. This job has no repository write access.
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require npm OIDC support
        run: |
          node --version
          npm --version
          node <<'EOF'
          const { execFileSync } = require('node:child_process');
          const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error('Trusted publishing requires npm 11.5.1 or later');
          }
          EOF

      - name: Match the tag to the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - name: Install the development runtime
        # Run the pinned installer explicitly, regardless of npm lifecycle policy.
        run: |
          npm install --global bun@1.4.2 --ignore-scripts
          node "$(npm root --global)/bun/install.js"
      - run: bun --version
      - run: bun test
      - run: bun run build
      - name: Test the distributed Node CLI
        run: STOW_TEST_RUNTIME="$(command -v node)" STOW_TEST_CLI="$PWD/dist/cli.js" bun test
      - name: Refuse changes to tracked files
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --porcelain --untracked-files=no
            exit 1
          fi
      # npm creates provenance only for public repositories. This repository is private.
      - name: Publish through the trusted publisher
        env:
          NPM_CONFIG_PROVENANCE: "false"
        run: npm publish
