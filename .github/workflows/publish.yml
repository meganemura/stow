# Publishes the version in package.json through npm OIDC when a push to main
# changes it, after both CLI runtimes pass the tests.
# The publish environment requires approval and allows deployments from main.
# The publish job has no repository write access. A last job creates the
# v<version> tag and the GitHub release after publish succeeds. It is separate
# so contents:write never sits on the job that holds the npm OIDC token.
name: Publish

on:
  push:
    branches: [main]
    paths: [package.json]

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A push to main that changes package.json releases its version when no
  # v<version> tag exists yet. Any other change to package.json, such as a
  # dependency bump, finds the tag and releases nothing.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version and look for its tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" >/dev/null 2>&1; then
            echo "v${version} already exists, so this push releases nothing"
          else
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.tag != ''
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require npm OIDC support
        run: |
          node --version
          npm --version
          node <<'EOF'
          const { execFileSync } = require('node:child_process');
          const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number);
          if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
            throw new Error('Trusted publishing requires npm 11.5.1 or later');
          }
          EOF

      - name: Install the development runtime
        # Run the pinned installer explicitly, regardless of npm lifecycle policy.
        run: |
          npm install --global bun@1.4.2 --ignore-scripts
          node "$(npm root --global)/bun/install.js"
      - run: bun --version
      - run: bun test
      - run: bun run build
      - name: Test the distributed Node CLI
        run: STOW_TEST_RUNTIME="$(command -v node)" STOW_TEST_CLI="$PWD/dist/cli.js" bun test
      - name: Refuse changes to tracked files
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --porcelain --untracked-files=no
            exit 1
          fi
      - name: Publish through the trusted publisher
        run: npm publish --provenance

  # Runs only after npm publish succeeds. A separate job keeps contents:write
  # away from the job that holds the npm OIDC token.
  release:
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the GitHub release from this version's changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          PUBLISHED_SHA: ${{ github.sha }}
        run: |
          version="${TAG#v}"
          # --notes-file CHANGELOG.md would carry every version, so extract only this one.
          # Headings follow Keep a Changelog: ## [<version>] - <date>.
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {in_version=1; next} /^## /{in_version=0} in_version' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          # A re-run must not fail on a release that already exists.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists"
            exit 0
          fi
          # The tag does not exist yet: this call creates it on the published commit.
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "$PUBLISHED_SHA"
