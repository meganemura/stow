# Runs the tests, the module-boundary check, and the nukadoko scenario on every push to main and queue,
# and on pull requests. The matrix is the new floor and the current Node.js lines.
name: CI

on:
  push:
    branches: [main, queue]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "24.22.1", "26.12.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install the development runtime
        # Run the pinned installer explicitly, regardless of npm lifecycle policy.
        run: |
          npm install --global bun@1.4.2 --ignore-scripts
          node "$(npm root --global)/bun/install.js"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run archstrict
      - run: bun run build
      - name: Run the nukadoko scenario against the distributed Node CLI
        run: bun run test:scenarios
